{% extends "base.html" %}
{% block title %}{% if appointment %}Modifier RDV{% else %}Nouveau RDV{% endif %}{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h3 class="mb-3">{% if appointment %}Modifier{% else %}Planifier{% endif %} un rendez-vous</h3>
    <form method="post" class="row g-3">
      {% if return_to %}
      <input type="hidden" name="return_to" value="{{ return_to }}">
      {% endif %}
      <div class="col-md-6">
        <label class="form-label">Client</label>
        <select name="client_id" class="form-select" required>
          {% for client in clients %}
            <option value="{{ client.id }}" {% if (appointment and appointment.client_id == client.id) or (not appointment and selected_client_id and selected_client_id == client.id) %}selected{% endif %}>{{ client.company or client.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Date</label>
        <input type="date" name="date" class="form-control" required value="{{ appointment.date if appointment else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Heure</label>
        <input type="time" name="time" class="form-control" required value="{{ appointment.time if appointment else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Lieu</label>
        <input name="location" class="form-control" value="{{ appointment.location if appointment else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Statut</label>
        <select name="status" class="form-select">
          <option value="pending" {% if not appointment or appointment.status == "pending" %}selected{% endif %}>En attente</option>
          <option value="done" {% if appointment and appointment.status == "done" %}selected{% endif %}>Terminé</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="4">{{ appointment.notes if appointment else '' }}</textarea>
      </div>
      <div class="col-12">
        <button class="btn btn-primary">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('appointments.list_appointments') }}">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{% if client %}Modifier client{% else %}Nouveau client{% endif %}{% endblock %}

{% block content %}

<div class="card shadow-sm">

  <div class="card-body p-4">

    <h3 class="mb-3">{% if client %}Modifier{% else %}Ajouter{% endif %} un client</h3>

    <form method="post" class="row g-3">

      <div class="col-md-6">

        <label class="form-label">Nom de l'entreprise</label>

        <input
          name="company"
          class="form-control"
          required
          value="{{ (client.company or client.name) if client else '' }}"
        >

      </div>

      <div class="col-md-6">

        <label class="form-label">Telephone</label>

        <input name="phone" class="form-control" value="{{ client.phone if client else '' }}">

      </div>

      <div class="col-md-6">

        <label class="form-label">Lieu</label>

        <input name="location" class="form-control" value="{{ client.location if client else '' }}" placeholder="Ex: Goma, Kinshasa...">

      </div>

      <div class="col-md-6">

        <label class="form-label">Adresse</label>

        <input name="address" class="form-control" value="{{ client.address if client else '' }}" placeholder="Ex: Avenue..., Quartier..., Commune...">

      </div>

      <div class="col-md-6">

        <label class="form-label">Domaine d'activité</label>

        <input name="activity_domain" class="form-control" value="{{ client.activity_domain if client else '' }}" placeholder="Ex: Logistique, Construction, IT...">

      </div>

      <div class="col-md-6">

        <label class="form-label">Email</label>

        <input type="email" name="email" class="form-control" value="{{ client.email if client else '' }}">

      </div>

      <div class="col-md-6">

        <label class="form-label">Étape pipeline</label>

        <select class="form-select" name="pipeline_stage">
          {% for stage_key, stage_label in stage_options %}
          <option value="{{ stage_key }}" {% if client and client.pipeline_stage == stage_key %}selected{% endif %}>
            {{ stage_label }}
          </option>
          {% endfor %}
        </select>

      </div>

      <div class="col-12">

        <label class="form-label">Notes</label>

        <textarea name="notes" class="form-control" rows="4">{{ client.notes if client else '' }}</textarea>

      </div>

      <div class="col-12">

        <button class="btn btn-primary">Enregistrer</button>

        <a class="btn btn-outline-secondary" href="{{ url_for('clients.list_clients') }}">Annuler</a>

      </div>

    </form>

  </div>

</div>

{% endblock %}

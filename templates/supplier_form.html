{% extends "base.html" %}
{% block title %}{% if supplier %}Modifier fournisseur{% else %}Nouveau fournisseur{% endif %}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">{% if supplier %}Modifier fournisseur{% else %}Nouveau fournisseur{% endif %}</h2>
  <a href="{{ url_for('suppliers.list_suppliers') }}" class="btn btn-outline-secondary">Retour</a>
</div>

<div class="card shadow-sm">
  <div class="card-body p-4">
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nom</label>
        <input class="form-control" name="name" required value="{{ supplier.name if supplier else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Type</label>
        <select class="form-select" name="partner_type">
          {% for key, label in supplier_types %}
          <option value="{{ key }}" {% if supplier and supplier.partner_type == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Actif</label>
        <select class="form-select" name="is_active">
          <option value="1" {% if not supplier or supplier.is_active %}selected{% endif %}>Oui</option>
          <option value="0" {% if supplier and not supplier.is_active %}selected{% endif %}>Non</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Contact</label>
        <input class="form-control" name="contact_name" value="{{ supplier.contact_name if supplier else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" value="{{ supplier.email if supplier else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Téléphone</label>
        <input class="form-control" name="phone" value="{{ supplier.phone if supplier else '' }}">
      </div>

      <div class="col-md-8">
        <label class="form-label">Catégorie service/produit</label>
        <input class="form-control" name="service_category" value="{{ supplier.service_category if supplier else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Délai de traitement (jours)</label>
        <input type="number" min="0" class="form-control" name="sla_days" value="{{ supplier.sla_days if supplier else '' }}">
      </div>

      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea class="form-control" rows="4" name="notes">{{ supplier.notes if supplier else '' }}</textarea>
      </div>
      <div class="col-12">
        <button class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
